<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발음 시험 · 단어고양</title>
<style>
:root{--bg:#1a0f24;--panel:#2a1838;--ink:#fff;--muted:#cbb8dc;--pink:#ff7ab8;--line:#5a3a74;}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif;}
.wrap{max-width:520px;margin:0 auto;padding:16px;}
h1{font-size:1.2rem;margin:4px 0 6px;}
p{color:var(--muted);font-size:.9rem;margin:0 0 12px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;}
button{flex:1 1 100%;text-align:left;cursor:pointer;}
button b{color:var(--pink);margin-right:6px;}
button small{display:block;color:var(--muted);font-size:.8rem;}
.kana button{flex:1 1 18%;text-align:center;font-size:1.3rem;}
#log{font-size:.78rem;color:var(--muted);white-space:pre-wrap;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">
<h1>가나 발음 끊김 시험</h1>
<p>아이폰에서 한 글자 발음이 짧게 끊기는 문제(26.11.08)를 가리는 페이지. 글자를 고르고 방법 1~8을 하나씩 눌러, 온전하게 들리는 번호를 알려 주세요. 게임에는 링크하지 않는다.</p>
<div class="row"><select id="voice" aria-label="목소리"></select></div>
<div class="row kana" id="kana"></div>
<div class="row" id="ways"></div>
<div id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id);let ch='あ';const keep=[];
function log(t){$('log').textContent=t+'\n'+$('log').textContent;}
function voices(){return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));}
function fill(){const vs=voices(),sel=$('voice'),cur=sel.value;sel.innerHTML=vs.map(v=>`<option value="${v.name}">${v.name} (${v.lang}${v.localService?'':', 온라인'})</option>`).join('')||'<option>일본어 목소리 없음</option>';if(cur)sel.value=cur;}
fill();speechSynthesis.onvoiceschanged=fill;
function utt(text,o={}){const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';const v=voices().find(v=>v.name===$('voice').value);if(v)u.voice=v;u.rate=o.rate??.9;u.volume=o.volume??1;u.pitch=1;
  const t0=performance.now();u.onstart=()=>log(`${text} 시작`);u.onend=()=>log(`${text} 끝 ${Math.round(performance.now()-t0)}ms`);keep.push(u);if(keep.length>20)keep.shift();return u;}
const WAYS=[
 ['지금 방식','그대로 읽기(0.9배)',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt(ch));}],
 ['취소 없이','cancel()을 부르지 않고 읽기',()=>{speechSynthesis.speak(utt(ch));}],
 ['뒤에 소리 없는 발화','읽은 뒤 소리 0인 발화를 이어 붙여 오디오를 붙잡아 둠',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt(ch));speechSynthesis.speak(utt('ああああ',{volume:0}));}],
 ['앞에 소리 없는 발화','소리 0인 발화를 먼저 읽고 바로 이어서',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt('あ',{volume:0}));speechSynthesis.speak(utt(ch));}],
 ['앞에 쉼표','「、」+글자',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt('、'+ch));}],
 ['뒤에 쉼표 여러 개','글자+「、、、」',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt(ch+'、、、'));}],
 ['느리게','0.5배',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt(ch,{rate:.5}));}],
 ['두 번','「あ、あ」처럼 두 번',()=>{speechSynthesis.cancel();speechSynthesis.speak(utt(ch+'、'+ch));}],
];
$('ways').innerHTML=WAYS.map((w,i)=>`<button data-i="${i}"><b>${i+1}</b>${w[0]}<small>${w[1]}</small></button>`).join('');
$('ways').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const w=WAYS[+b.dataset.i];log(`— ${+b.dataset.i+1}. ${w[0]} · ${ch} · ${$('voice').value}`);w[2]();});
$('kana').innerHTML=[...'あいうえおかつん'].map(c=>`<button>${c}</button>`).join('');
$('kana').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ch=b.textContent;[...$('kana').children].forEach(x=>x.style.borderColor=x===b?'var(--pink)':'');});
$('kana').children[0].style.borderColor='var(--pink)';
</script>
</body>
</html>
